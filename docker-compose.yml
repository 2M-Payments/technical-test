services:
  mysql:
    image: mysql:8.4
    container_name: crud-usuarios-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crud_usuarios
    ports:
      # Porta 3307 no host evita conflito com um MySQL já instalado no Windows (3306).
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
